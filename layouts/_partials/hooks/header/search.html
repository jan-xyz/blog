{{- /*
  Header component: search button that opens a Pagefind modal.
  The index is generated after the Hugo build: `pagefind --site public` (see netlify.toml).
*/ -}}
{{- $search := resources.Get "js/search.js" | minify | resources.Fingerprint -}}
<button type="button" id="search-toggle" class="ananke-search-toggle" aria-label="Search" aria-expanded="false" aria-controls="search-modal">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>
</button>
<div id="search-modal" class="ananke-search-modal" hidden>
  <div class="ananke-search-backdrop" data-search-close></div>
  <div class="ananke-search-panel" role="dialog" aria-modal="true" aria-label="Search">
    <div id="search"></div>
  </div>
</div>
<script src="/pagefind/pagefind-ui.js" defer></script>
<script src="{{ $search.RelPermalink }}" integrity="{{ $search.Data.Integrity }}" defer></script>
