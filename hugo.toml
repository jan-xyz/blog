baseURL = "https://blog.jan-steinke.de"
locale = "de-de"
title = "Eine weitere Selbstdarstellung"
theme = [ "github.com/jan-xyz/hugo-module-img-srcset", "github.com/gohugo-ananke/ananke/v2"]
DefaultContentLanguage = "de"
timeout = "120s"

[pagination]
pagerSize = 9

[outputs]
home = [ "HTML", "RSS", "JSON" ]

[params]
  site_logo = "/img/logo.svg"
  show_reading_time = true

[params.ananke]
custom_css = [ "search.css", "dark.css" ]

[params.ananke.header]
navigation = [ [ "logo" ], [ "languages", "menu", "social" ], [ "search" ] ]

[params.ananke.social.follow]
networks = [ "twitter", "github", "mastodon", "linkedin" ]

[params.ananke.social.twitter]
username = "janxyz"

[params.ananke.social.github]
username = "jan-xyz"

[params.ananke.social.mastodon]
profilelink = "https://det.social/@janxyz"
rel = "me"

[params.ananke.social.linkedin]
profilelink = "https://www.linkedin.com/in/jan-steinke-b5b3a346/"

[languages]
  [languages.de]
    title = "Eine weitere Selbstdarstellung"
    weight = 1
    copyright = "alles meins"
    label = "Deutsch"
    [[languages.de.menu.main]]
    url    = "/de/"
    name   = "Startseite"
    weight = 10
    [[languages.de.menu.main]]
    url    = "/posts/tech/"
    name   = "Tech"
    weight = 12
  [languages.en]
    title = "Just another grandstanding"
    weight = 2
    copyright = "Everything is mine"
    label = "English"
    [[languages.en.menu.main]]
    url    = "/en/"
    name   = "Home"
    weight = 10
    [[languages.en.menu.main]]
    url    = "/en/posts/tech/"
    name   = "Tech"
    weight = 12
